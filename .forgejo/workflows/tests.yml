name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formula-syntax:
    name: Formula syntax
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.flow == 0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ruby
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ruby
      - name: Parse the formulae
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            ruby -c "$formula"
          done
      - name: Test the release formula checks
        run: python3 -B -m unittest discover -s tests
